; PlatformIO project for the Viewe UEED024QV-RH40-A003A
; (2.41" 240x320 TFT, ST7789 controller, raw 40-pin 0.5mm FPC with
; capacitive touch pins present but unused) driven by an ESP32-S3.
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.10
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
