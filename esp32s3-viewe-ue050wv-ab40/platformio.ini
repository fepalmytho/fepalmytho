; PlatformIO project for the Viewe LCM-UE050WV-AB40-L159A
; (5.0" IPS TFT, 800x480, RGB 24-bit parallel, ST72568, raw 40-pin
; 0.5mm FPC, 1000 nits) driven by an ESP32-S3's native RGB/DPI LCD
; peripheral -- no SPI-to-parallel bridge chip needed.
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
lib_deps =
    moononournation/GFX Library for Arduino@^1.4.9
