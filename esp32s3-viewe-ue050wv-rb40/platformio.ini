; PlatformIO project for the Viewe LCM-UEED050WV-RB40-L001A
; (5.0" Transflective TFT, 800x480, RGB 24-bit parallel, ST7282A,
; raw 40-pin 0.5mm FPC, 220 cd/m2 transmissive) driven by an ESP32-S3's
; native RGB/DPI LCD peripheral -- no SPI-to-parallel bridge chip needed.
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
lib_deps =
    moononournation/GFX Library for Arduino@^1.4.9
