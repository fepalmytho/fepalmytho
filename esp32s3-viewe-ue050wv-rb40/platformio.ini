; PlatformIO project for the Viewe UEDX80480050E-WB-B shield
; (ESP32S3-MCN16R8: 16MB flash, 8MB octal PSRAM) driving a separately
; purchased Viewe LCM-UEED050WV-RB40-L001A (5.0" Transflective TFT,
; 800x480, RGB 24-bit parallel, ST7282A, 220 cd/m2) over the shield's
; 40-pin RGB header -- see docs/shield.md for why the GPIO map below is
; fixed by the board, not a free choice.
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_size = 16MB
lib_deps =
    moononournation/GFX Library for Arduino@^1.4.9
